# Configuración de Hardware y Políticas del Clúster HPC - IALP (CONICET / UNLP)
cluster:
  name: "CLUSTER GAMA (FCAG-IALP)"

institution:
  name: "Instituto de Astrofísica de La Plata (IALP - CONICET / UNLP)"
  access_host: "163.10.86.211"
  support_team:
    - name: "Ing. Nehuen Pereyra"
      role: "Soporte HPC / Administrador de Cómputo"
      email: "ialp@fcaglp.unlp.edu.ar"
    - name: "Téc. Juan Ignacio Rodriguez"
      role: "Soporte Técnico HPC"

nodes:
  head_node:
    hostname: "head001"
    cpu: "Intel(R) Celeron(R) G5905"
    cores: 2
    threads: 2
    frequency_ghz: 3.50
    ram_gb: 32
    ram_type: "DDR4 2400 MHz"
    storage:
      system_ssd_gb: 500
      data_hdd_tb: 8
    network: "Realtek 1GbE"
    allow_compute: false  # Prohibido ejecutar cómputo directamente aquí

  # Verificado en el servidor (scontrol show nodes): 5 nodos. Slurm cuenta hilos como CPUs
  # (CPUTot=32 o 24) y asigna núcleos completos: una tarea de 1 CPU ocupa 2 CPUs (1 núcleo).
  compute_nodes:
    - name: "node001"
      cpu: "AMD Ryzen 9 5950X"
      architecture: "Zen 3 (x86_64)"
      cores: 16
      threads: 32
      slurm_cpus: 32        # CPUTot en Slurm (cuenta hilos SMT)
      real_memory_mb: 125000     # RealMemory en Slurm
      ram_gb: 128
      storage_ssd_gb: 500
      network: "Realtek 2.5GbE"
    - name: "node002"
      cpu: "AMD Ryzen 9 5950X"
      architecture: "Zen 3 (x86_64)"
      cores: 16
      threads: 32
      slurm_cpus: 32        # CPUTot en Slurm (cuenta hilos SMT)
      real_memory_mb: 125000     # RealMemory en Slurm
      ram_gb: 128
      storage_ssd_gb: 500
      network: "Realtek 2.5GbE"
    - name: "node003"
      cpu: "AMD Ryzen 9 5900X"
      architecture: "Zen 3 (x86_64)"
      cores: 12
      threads: 24
      slurm_cpus: 24        # CPUTot en Slurm (cuenta hilos SMT)
      real_memory_mb: 125000     # RealMemory en Slurm
      ram_gb: 128
      storage_ssd_gb: 500
      network: "Realtek 2.5GbE"
    - name: "node004"
      cpu: "AMD Ryzen 9 5900X"
      architecture: "Zen 3 (x86_64)"
      cores: 12
      threads: 24
      slurm_cpus: 24        # CPUTot en Slurm (cuenta hilos SMT)
      real_memory_mb: 125000     # RealMemory en Slurm
      ram_gb: 128
      storage_ssd_gb: 500
      network: "Realtek 2.5GbE"
    - name: "node005"
      cpu: "AMD Ryzen 9 5900X"
      architecture: "Zen 3 (x86_64)"
      cores: 12
      threads: 24
      slurm_cpus: 24        # CPUTot en Slurm (cuenta hilos SMT)
      real_memory_mb: 125000     # RealMemory en Slurm
      ram_gb: 128
      storage_ssd_gb: 500
      network: "Realtek 2.5GbE"

summary_resources:
  total_compute_nodes: 5
  total_physical_cores: 68
  total_threads: 136
  total_compute_ram_gb: 640

partitions:
  short:
    description: "Trabajos de prueba y corridas breves"
    max_time: "04:00:00"
    max_time_seconds: 14400
    priority: 100
    is_default: false
  medium:
    description: "Trabajos diarios estándar (cola predeterminada)"
    max_time: "24:00:00"
    max_time_seconds: 86400
    priority: 80
    is_default: true
  long:
    description: "Trabajos de producción que requieren hasta una semana"
    max_time: "7-00:00:00"
    max_time_seconds: 604800
    priority: 50
    is_default: false
  # Cola restringida: no aparece en `sinfo` para usuarios comunes, pero tiene jobs en ejecución
  # (squeue). El linter la acepta si el investigador la usa, pero nunca la propone ni la cambia.
  # PENDIENTE: confirmar MaxTime con `scontrol show partition prolonged` (como root).
  prolonged:
    description: "Simulaciones extensivas de más de una semana (requiere autorización)"
    max_time: "UNLIMITED"
    max_time_seconds: -1
    priority: 30
    is_default: false
    restricted: true

# Módulos de entorno disponibles en el servidor (module avail). Los usa el linter #SBATCH
# para sugerir nombres que existen realmente.
software_modules:
  python: "python/3.12"
  mpi:
    - "mpi/openmpi-x86_64"
    - "mpi/mpich-x86_64"
    - "intel/mpi/2021.14"

policies:
  allow_unmanaged_runs: false  # Estrictamente prohibido ejecutar fuera del sistema de colas
  jupyter_restricted: true      # Restringido salvo autorización expresa
  interactive_max_time: "01:00:00"
  interactive_max_time_seconds: 3600
  scratch_storage_path: "/scratch"
  mass_storage_path: "/data"
